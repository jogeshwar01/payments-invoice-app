services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dodo
      POSTGRES_USER: dodo
      POSTGRES_PASSWORD: dodo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dodo -d dodo"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "7000:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mock-psp:
    build: .
    command: ["mock-psp"]
    environment:
      MOCK_PSP_BIND: "0.0.0.0:8081"
      RUST_LOG: "info"
    ports:
      - "7001:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build: .
    command: ["dodo-api"]
    depends_on:
      postgres:
        condition: service_healthy
      mock-psp:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://dodo:dodo@postgres:5432/dodo"
      PSP_BASE_URL: "http://mock-psp:8081"
      BIND: "0.0.0.0:8080"
      RUST_LOG: "info,dodo_api=info"
    ports:
      - "7002:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
